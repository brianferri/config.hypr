# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution

$font = CaskaydiaMono Nerd Font

$wimstWhite = rgba(255, 255, 255, 1.0)
$wimstBlue  = rgba(79, 137, 244, 1.0)
$wimstRed   = rgba(204, 34, 34, 1.0)
$wimstAmber = rgba(255, 200, 80, 1.0)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

input-field {
    monitor =
    size = 50%, 25%

    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)
    rounding = 0

    font_family = $font
    font_size = 96
    font_color = $wimstWhite

    check_color = $wimstBlue
    fail_color  = $wimstRed
    capslock_color = $wimstAmber
    swap_font_color = false

    dots_text_format = *
    dots_spacing = 0.2
    dots_center = true

    placeholder_text = <span foreground="##4F89F4"><b>▌</b></span>
    fail_text = <i>$PAMFAIL</i>

    hide_input = false
    fade_on_empty = false

    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font

    position = 0, 0
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = 0, -150
    halign = center
    valign = top
}

